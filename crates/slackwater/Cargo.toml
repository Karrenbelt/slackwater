[package]
name = "slackwater"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[dependencies]
alloy = { version = "2.5.0", default-features = false, features = [
    "std",
    "json",
    "sol-types",
    "contract",
    "provider-http",
    "reqwest",
    "reqwest-rustls-tls",
    "rpc-client",
    "rpc-types",
    "signer-keystore",
    "signers",
    "transport-throttle",
] }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dialoguer = { version = "0.12.0", default-features = false, features = ["password"] }
perpl-sdk = { path = "../../upstream/dex-sdk/crates/sdk", default-features = false }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }
toml = "0.8.23"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt"] }
